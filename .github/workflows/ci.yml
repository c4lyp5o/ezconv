# Validate the frontend, publish a static artifact, and optionally package it
# as a static Nginx image. No application backend is built or deployed.
name: CI

on:
  push:
    branches: [main, master, development]
    tags: ["v*"]
  pull_request:
    branches: [main, master, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the dev box's runtime — CI and dev share a Bun.
          bun-version: "1.4.4"

      - name: 📦 Install repository tooling (lockfile)
        run: bun install --frozen-lockfile

      - name: 📦 Install client deps (lockfile)
        working-directory: client
        run: bun install --frozen-lockfile

      - name: 🏷️ Validate release metadata
        run: bun run release:validate

      - name: 🧹 Lint (Biome)
        run: bun run lint

      - name: 🧪 Client suite (vitest)
        working-directory: client
        run: bun run test --run

      - name: 🌐 Client build (vite)
        working-directory: client
        run: bun run build

      - name: 📦 Prepare versioned release files
        run: bun scripts/release.mjs --package-only

      - name: 📦 Versioned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezconv-release
          path: release/*/*
          if-no-files-found: error

      - name: 📦 Static frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezconv-dist
          path: dist/
          if-no-files-found: error

  image:
    name: Build & push GHCR image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🏷️ Tags (branch-explicit)
        id: meta
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/${owner}/${repo}"
          sha=$(git rev-parse --short=12 HEAD)
          {
            echo "image=${img}"
            echo "tags<<EOF"
            echo "${img}:sha-${sha}"
            case "${GITHUB_REF}" in
              refs/heads/main)        echo "${img}:main"; echo "${img}:latest" ;;
              refs/heads/master)      echo "${img}:master"; echo "${img}:latest" ;;
              refs/heads/development) echo "${img}:development" ;;
              refs/tags/*)            echo "${img}:${GITHUB_REF_NAME}" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags for ${GITHUB_REF_NAME}:"; sed -n '3,9p' "$GITHUB_OUTPUT"

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # amd64 only: the fleet is amd64 and skipping QEMU halves the build
          # time. Add linux/arm64 the day something arm64 needs ezconv.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ezconv
            org.opencontainers.image.description=Private frontend-only file converter and compressor
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔔 Notify ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -n "$NTFY_URL" ]; then
            curl \
              -H "Title: Build ${{ job.status }}: ezconv:${{ github.ref_name }}" \
              -H "Priority: ${{ job.status == 'success' && 'default' || 'high' }}" \
              -H "Tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }},rocket" \
              -d "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}" \
              "$NTFY_URL"
          fi

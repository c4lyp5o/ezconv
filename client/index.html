<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#171719" />
    <script>
      // ez theme bootstrap: inline and non-module so it runs before first
      // paint. One rule — a stored choice wins, otherwise DARK.
      (function () {
        try {
          var t = localStorage.getItem('ez.theme') === 'light' ? 'light' : 'dark';
          var r = document.documentElement;
          r.classList.toggle('dark', t === 'dark');
          r.classList.toggle('light', t === 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#171719' : '#f9fafb');
        } catch (e) { /* class="dark" is already on <html> */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ezconv</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

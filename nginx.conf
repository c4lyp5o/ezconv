# This file is included in nginx's http context.
map $uri $ezconv_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 5000;
    listen [::]:5000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $ezconv_cache_control;

    # Nginx's default MIME table does not include PDF.js's module worker suffix.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # The app has no client-side routes. Missing assets must remain real 404s.
    location / {
        try_files $uri $uri/ =404;
    }
}
